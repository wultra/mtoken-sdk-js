name: CI
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build
